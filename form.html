<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div
      style="text-align: left; background-color: aquamarine; font-size: 30px"
    >
      <h1 style="text-align: center">REGISTRATION FORM</h1>
      <form style="border: 3px solid black; padding: 16px; height: 100vh">
        <br />
        <label for="app">Application number:</label>
        <input
          type="text"
          name="appplication number"
          id="number"
          required
        /><br /><br />
        <label for="fname">First name:</label>
        <input
          type="text"
          id="fname"
          name="fname"
          placeholder="Enter your first Name"
        />
        <br /><br />
        <label for="lname">Last name:</label>
        <input
          type="text"
          id="lname"
          name="lname"
          placeholder="Enter your last name"
        />
        <br /><br />
        <label for="dob">Date of birth:</label>
        <input type="date" name="dob" id="dob" /><br /><br />
        <label for="age">Your Age:</label>
        <input type="text" name="age" id="age" min="18" max="30" /><br /><br />
        <label for="address">Address :</label>
        <textarea></textarea><br /><br />
        <label for="mail">Email:</label>
        <input
          type="mail"
          name="mail"
          id="mail"
          required
          value="@gmail.com"
        /><br /><br />
        <label for="name">Guardian name:</label>
        <input type="name" name="guardian name" id="name" /><br /><br />
        <label for="phone">phone number:</label>
        <input
          type="tel"
          id="phone"
          name="phone"
          pattern="[0-9]{3}-[0-9]{
            3}-[0-9]{4}"
          minlength="10"
        /><br /><br />
        <label for="dept">Department:</label>
        <input type="radio" id="cse" name="department" value="CSE" />
        <label for="cse">CSE</label>
        <input type="radio" id="it" name="department" value="IT" />
        <label for="it">IT </label>
        <input type="radio" id="ece" name="department" value="ECE" />

        <label for="ece"> ECE</label><br /><br />
        <label for="talent">Talents:</label>
        <input type="checkbox" id="talent" name="talent" value="singing" />
        <label for="talent1"> singing </label>
        <input type="checkbox" id="talent" name=" talent" value="dancing" />
        <label for="talent2"> dancing</label>
        <input type="checkbox" id="talent" name="talent" value="drawing" />
        <label for="talemt3"> drawing</label><br /><br />

        <input
          style="
            padding: 15px 23px 15px 23px;
            font-size: 25px;
            background-color: antiquewhitetd;
          "
          type="submit"
          value="Submit"
        />
      </form>
    </div>
  </body>
</html>
